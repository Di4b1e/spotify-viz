<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify PFP Visualizer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --accent: #7c5cff;
    --accent-2: #ff5ca8;
    --accent-3: #5cffe1;
    --spotify: #1DB954;
    --bg: #08080f;
  }
  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    padding: 16px;
    color: #e8e8ff;
    overflow-x: hidden;
  }
  .bg-layer {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(ellipse at 15% 20%, rgba(124,92,255,.25) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 80%, rgba(255,92,168,.2) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(92,255,225,.08) 0%, transparent 60%),
      linear-gradient(180deg, #08080f 0%, #0d0d1a 100%);
    animation: bgShift 18s ease-in-out infinite alternate;
  }
  @keyframes bgShift {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(25deg); }
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .5; z-index: -1; pointer-events: none; }
  .orb-1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(124,92,255,.55), transparent 70%); top: -120px; left: -80px; animation: float1 24s ease-in-out infinite; }
  .orb-2 { width: 340px; height: 340px; background: radial-gradient(circle, rgba(255,92,168,.5), transparent 70%); bottom: -100px; right: -60px; animation: float2 28s ease-in-out infinite; }
  .orb-3 { width: 280px; height: 280px; background: radial-gradient(circle, rgba(92,255,225,.4), transparent 70%); top: 45%; left: 62%; animation: float3 32s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,90px) scale(1.15); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-80px,-60px) scale(1.1); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-60px,50px) scale(.9); } }
  #particleCanvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .55; }

  .app {
    max-width: 1050px; width: 100%;
    background: rgba(20,20,35,.55);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-radius: 36px;
    padding: 30px;
    border: 1px solid rgba(140,120,255,.25);
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(140,120,255,.12), inset 0 1px 0 rgba(255,255,255,.07);
    position: relative; overflow: hidden;
    animation: appFadeIn .9s cubic-bezier(.22,1,.36,1);
  }
  @keyframes appFadeIn { from { opacity: 0; transform: translateY(30px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .app::before {
    content: ''; position: absolute; top: 0; left: 10%; right: 10%; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), var(--accent-3), transparent);
    background-size: 200% 100%; animation: borderGlow 4s linear infinite; border-radius: 2px;
  }
  @keyframes borderGlow { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }

  .header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
  .pfp-section { display: flex; align-items: center; gap: 20px; }
  .pfp-frame {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, #0e121f, #1a1a30); padding: 3px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    animation: pfpSpin 8s linear infinite;
  }
  @keyframes pfpSpin {
    0%,100% { box-shadow: 0 0 20px rgba(124,92,255,.4), 0 0 0 0 rgba(124,92,255,.3); }
    50% { box-shadow: 0 0 35px rgba(255,92,168,.5), 0 0 0 4px rgba(255,92,168,.15); }
  }
  .pfp-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #0a0d16; }
  .pfp-inner img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .pfp-placeholder { font-size: 44px; user-select: none; animation: emojiPulse 3s ease-in-out infinite; }
  @keyframes emojiPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .pfp-upload { display: flex; flex-direction: column; gap: 8px; }
  .pfp-upload label {
    background: linear-gradient(135deg, rgba(124,92,255,.2), rgba(255,92,168,.15));
    border: 1px solid rgba(124,92,255,.5); color: #d5d0ff;
    padding: 11px 26px; border-radius: 40px; font-size: .92rem;
    font-weight: 600; cursor: pointer; transition: all .25s ease;
    text-align: center; letter-spacing: .4px; position: relative; overflow: hidden;
  }
  .pfp-upload label:hover {
    background: linear-gradient(135deg, rgba(124,92,255,.4), rgba(255,92,168,.3));
    border-color: #9c7cff; color: white;
    box-shadow: 0 0 24px rgba(124,92,255,.45); transform: translateY(-1px);
  }
  .pfp-upload input[type="file"] { display: none; }
  .title-area { text-align: right; flex: 1; }
  .title-area h1 {
    font-size: 1.5rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; animation: titleShine 5s linear infinite;
  }
  @keyframes titleShine { to { background-position: 200% center; } }
  .title-area p { font-size: .75rem; color: #6a7aa8; margin-top: 4px; letter-spacing: .4px; }

  .visualizer-container {
    background: rgba(6,8,15,.7); border-radius: 28px; padding: 16px; margin-bottom: 20px;
    border: 1px solid rgba(124,92,255,.2);
    box-shadow: inset 0 0 40px rgba(0,0,0,.8), 0 0 30px rgba(124,92,255,.08);
    position: relative; overflow: hidden;
  }
  .visualizer-container::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 120%, rgba(124,92,255,.15), transparent 60%);
    pointer-events: none;
  }
  canvas#visualizerCanvas {
    display: block; width: 100%; height: auto; background: #05060c;
    border-radius: 18px; box-shadow: 0 0 30px rgba(0,20,60,.8);
    aspect-ratio: 16/7; cursor: pointer;
  }

  .status-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; background: rgba(8,12,24,.6);
    border-radius: 40px; border: 1px solid #2a2a45;
    margin-bottom: 16px; font-size: .88rem;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; transition: all .3s; }
  .status-dot.ready { background: var(--spotify); box-shadow: 0 0 12px var(--spotify); }
  .status-dot.playing { background: var(--accent-3); box-shadow: 0 0 14px var(--accent-3); animation: dotPulse 1.2s ease-in-out infinite; }
  .status-dot.error { background: #ff5c5c; box-shadow: 0 0 12px #ff5c5c; }
  @keyframes dotPulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

  .track-card {
    display: flex; align-items: center; gap: 16px;
    background: rgba(8,12,24,.6); border-radius: 20px;
    padding: 14px 18px; margin-bottom: 18px;
    border: 1px solid rgba(124,92,255,.15);
    transition: all .3s ease;
  }
  .track-card.hidden { display: none; }
  .track-art {
    width: 64px; height: 64px; border-radius: 12px; object-fit: cover;
    background: #0a0d16; flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  .track-meta { flex: 1; min-width: 0; }
  .track-meta .t-title { font-size: 1rem; font-weight: 700; color: #e8e8ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta .t-artist { font-size: .82rem; color: #8a9bcf; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track-meta .t-progress { height: 3px; background: rgba(124,92,255,.15); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .track-meta .t-progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width .3s linear; border-radius: 3px; }

  .controls { display: flex; justify-content: center; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  .playback-controls {
    display: flex; align-items: center; gap: 12px;
    background: rgba(8,12,24,.75); padding: 6px 22px 6px 16px;
    border-radius: 60px; border: 1px solid #2a2a45;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  .playback-controls:hover { border-color: rgba(124,92,255,.5); box-shadow: 0 0 24px rgba(124,92,255,.12); }
  .playback-controls button {
    background: transparent; border: none; color: #b8b8ff;
    font-size: 1.5rem; cursor: pointer; width: 48px; height: 48px;
    border-radius: 50%; transition: all .2s; display: flex;
    align-items: center; justify-content: center; user-select: none;
  }
  .playback-controls button:hover { color: white; transform: scale(1.1); background: rgba(124,92,255,.15); }
  .playback-controls button:active { transform: scale(.95); }
  .playback-controls button:disabled { opacity: .25; cursor: not-allowed; transform: none; background: transparent; }
  .time-display { font-variant-numeric: tabular-nums; color: #c5ccff; font-size: .86rem; min-width: 86px; text-align: center; letter-spacing: .5px; font-weight: 500; }

  .btn-primary {
    background: linear-gradient(135deg, var(--spotify), #1ed760);
    color: #000; border: none; padding: 13px 32px;
    border-radius: 40px; font-weight: 700; cursor: pointer;
    font-size: .95rem; transition: all .25s; letter-spacing: .3px;
    box-shadow: 0 8px 20px -6px rgba(29,185,84,.5);
  }
  .btn-primary:hover { box-shadow: 0 12px 28px -6px var(--spotify); transform: translateY(-2px) scale(1.02); }
  .btn-primary:active { transform: translateY(0) scale(.98); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }

  .auth-row { text-align: center; margin-bottom: 16px; }
  .auth-row.hidden { display: none; }

  .volume-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px; color: #8a9bcf; font-size: .82rem; }
  .volume-row input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 200px; height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    outline: none; cursor: pointer;
  }
  .volume-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: white; box-shadow: 0 0 10px rgba(124,92,255,.8);
    cursor: pointer; transition: transform .2s;
  }
  .volume-row input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .volume-row input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: white; border: none; box-shadow: 0 0 10px rgba(124,92,255,.8);
    cursor: pointer;
  }

  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(20,20,40,.95); backdrop-filter: blur(12px);
    color: #e0e0ff; padding: 14px 28px; border-radius: 40px;
    font-size: .88rem; border: 1px solid rgba(124,92,255,.3);
    box-shadow: 0 20px 50px -10px rgba(0,0,0,.8);
    z-index: 1000; opacity: 0; transition: all .4s cubic-bezier(.22,1,.36,1);
    pointer-events: none; display: flex; align-items: center; gap: 10px;
    max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.error { border-color: rgba(255,80,80,.5); color: #ffb0b0; }
  .toast.success { border-color: rgba(29,185,84,.5); color: #b0ffcc; }

  .footer-note { text-align: center; margin-top: 20px; font-size: .72rem; color: #4a5a80; letter-spacing: .4px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
  .footer-note a { color: #6a7aa8; text-decoration: none; cursor: pointer; }
  .footer-note a:hover { color: #8a9bcf; }

  .hidden { display: none !important; }

  @media (max-width: 700px) {
    .app { padding: 20px; border-radius: 28px; }
    .pfp-frame { width: 76px; height: 76px; }
    .pfp-placeholder { font-size: 34px; }
    .header { flex-direction: column; align-items: flex-start; }
    .title-area { text-align: left; width: 100%; }
    .playback-controls button { font-size: 1.3rem; width: 42px; height: 42px; }
    .title-area h1 { font-size: 1.2rem; }
    .track-art { width: 50px; height: 50px; }
  }
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>
<canvas id="particleCanvas"></canvas>

<div class="app">
  <div class="header">
    <div class="pfp-section">
      <div class="pfp-frame">
        <div class="pfp-inner">
          <div class="pfp-placeholder" id="pfpPlaceholder">🎧</div>
          <img id="pfpImage" src="#" alt="profile">
        </div>
      </div>
      <div class="pfp-upload">
        <label for="pfpInput">✦ Choose PFP</label>
        <input type="file" id="pfpInput" accept="image/*">
      </div>
    </div>
    <div class="title-area">
      <h1>SPOTIFY VIBES</h1>
      <p>audio · pfp · premium</p>
    </div>
  </div>

  <div class="visualizer-container">
    <canvas id="visualizerCanvas" width="1000" height="440"></canvas>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Initializing…</span>
  </div>

  <div class="auth-row" id="authRow">
    <button class="btn-primary" id="loginBtn">Connect Spotify Premium</button>
  </div>

  <div class="track-card hidden" id="trackCard">
    <img class="track-art" id="trackArt" src="" alt="">
    <div class="track-meta">
      <div class="t-title" id="trackTitle">—</div>
      <div class="t-artist" id="trackArtist">—</div>
      <div class="t-progress"><div class="t-progress-fill" id="trackProgress"></div></div>
    </div>
  </div>

  <div class="controls">
    <div class="playback-controls">
      <button id="prevBtn" disabled title="Previous">⏮</button>
      <button id="playBtn" disabled title="Play">▶</button>
      <button id="pauseBtn" disabled title="Pause">⏸</button>
      <button id="nextBtn" disabled title="Next">⏭</button>
      <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
    </div>
  </div>

  <div class="volume-row">
    <span>🔉</span>
    <input type="range" id="volumeSlider" min="0" max="100" value="70">
    <span>🔊</span>
  </div>

  <div class="footer-note">
    <span>🎤 State-driven visualizer</span>
    <span>🖼️ Custom PFP</span>
    <a id="logoutLink" class="hidden">Log out</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
(function() {
  // ============================================================
  // ⚠️ STEP 1: PASTE YOUR CLIENT ID BELOW
  // ============================================================
  const CLIENT_ID = 'de46b1d0e36443488e051dcbe872f9b4';

  // ============================================================
  // ⚠️ STEP 2: PASTE YOUR HOSTED URL BELOW (must match Spotify dashboard exactly)
  // Example: 'https://yourname.github.io/spotify-viz/music.html'
  // Example: 'https://random-name.netlify.app/music.html'
  // ============================================================
  const REDIRECT_URI = 'PASTE_YOUR_HOSTED_URL_HERE';

  // Scopes for Web Playback SDK
  const SCOPES = [
    'streaming',
    'user-read-email',
    'user-read-private',
    'user-read-playback-state',
    'user-modify-playback-state',
    'user-read-currently-playing'
  ].join(' ');

  // ---------- DOM ----------
  const canvas = document.getElementById('visualizerCanvas');
  const ctx = canvas.getContext('2d');
  const particleCanvas = document.getElementById('particleCanvas');
  const pCtx = particleCanvas.getContext('2d');

  const pfpInput = document.getElementById('pfpInput');
  const pfpImage = document.getElementById('pfpImage');
  const pfpPlaceholder = document.getElementById('pfpPlaceholder');

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const loginBtn = document.getElementById('loginBtn');
  const authRow = document.getElementById('authRow');
  const logoutLink = document.getElementById('logoutLink');

  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');

  const trackCard = document.getElementById('trackCard');
  const trackArt = document.getElementById('trackArt');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const trackProgress = document.getElementById('trackProgress');

  const toast = document.getElementById('toast');

  // ---------- STATE ----------
  let player = null;
  let deviceId = null;
  let isPlaying = false;
  let progressMs = 0;
  let durationMs = 0;
  let animationFrame = null;
  let visualPhase = 0;
  let playerReady = false;

  // ---------- TOAST ----------
  let toastTimeout;
  function showToast(msg, type = '') {
    clearTimeout(toastTimeout);
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    requestAnimationFrame(() => toast.classList.add('show'));
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 3400);
  }

  // ---------- STATUS ----------
  function setStatus(type, msg) {
    statusText.textContent = msg;
    statusDot.className = 'status-dot' + (type ? ' ' + type : '');
  }

  // ---------- PARTICLE BACKGROUND ----------
  let particles = [];
  let pw, ph;
  function resizeParticles() {
    const dpr = window.devicePixelRatio || 1;
    pw = window.innerWidth;
    ph = window.innerHeight;
    particleCanvas.width = pw * dpr;
    particleCanvas.height = ph * dpr;
    particleCanvas.style.width = pw + 'px';
    particleCanvas.style.height = ph + 'px';
    pCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function createParticles() {
    particles = [];
    const count = Math.min(60, Math.floor(window.innerWidth / 22));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * pw,
        y: Math.random() * ph,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        opacity: Math.random() * 0.5 + 0.1,
        hue: [260, 320, 170][Math.floor(Math.random() * 3)]
      });
    }
  }
  function animateParticles() {
    pCtx.clearRect(0, 0, pw, ph);
    for (let p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = pw; if (p.x > pw) p.x = 0;
      if (p.y < 0) p.y = ph; if (p.y > ph) p.y = 0;
      pCtx.beginPath();
      pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      pCtx.fillStyle = `hsla(${p.hue},80%,70%,${p.opacity})`;
      pCtx.shadowColor = `hsla(${p.hue},90%,65%,.8)`;
      pCtx.shadowBlur = 8;
      pCtx.fill();
    }
    pCtx.shadowBlur = 0;
    for (let i = 0; i < particles.length; i++) {
      for (let j = i + 1; j < particles.length; j++) {
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          pCtx.beginPath();
          pCtx.moveTo(particles[i].x, particles[i].y);
          pCtx.lineTo(particles[j].x, particles[j].y);
          pCtx.strokeStyle = `hsla(260,70%,60%,${0.06*(1-dist/120)})`;
          pCtx.lineWidth = 0.8;
          pCtx.stroke();
        }
      }
    }
    requestAnimationFrame(animateParticles);
  }
  resizeParticles(); createParticles(); animateParticles();
  window.addEventListener('resize', () => { resizeParticles(); createParticles(); });

  // ---------- PKCE ----------
  function generateRandomString(length) {
    const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    const values = crypto.getRandomValues(new Uint8Array(length));
    return values.reduce((acc, x) => acc + possible[x % possible.length], '');
  }
  async function sha256(plain) {
    const encoder = new TextEncoder();
    const data = encoder.encode(plain);
    return window.crypto.subtle.digest('SHA-256', data);
  }
  function base64encode(input) {
    return btoa(String.fromCharCode(...new Uint8Array(input)))
      .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
  }
  async function generateCodeChallenge(verifier) {
    const hashed = await sha256(verifier);
    return base64encode(hashed);
  }

  // ---------- OAUTH ----------
  async function startAuthFlow() {
    if (REDIRECT_URI === 'PASTE_YOUR_HOSTED_URL_HERE') {
      showToast('Set REDIRECT_URI in the code first!', 'error');
      return;
    }
    const codeVerifier = generateRandomString(64);
    localStorage.setItem('spotify_code_verifier', codeVerifier);
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    const params = new URLSearchParams({
      client_id: CLIENT_ID,
      response_type: 'code',
      redirect_uri: REDIRECT_URI,
      scope: SCOPES,
      code_challenge_method: 'S256',
      code_challenge: codeChallenge,
      show_dialog: 'true'
    });
    window.location.href = 'https://accounts.spotify.com/authorize?' + params.toString();
  }

  async function handleAuthCallback() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');

    if (error) {
      setStatus('error', 'Auth error: ' + error);
      showToast('Authorization failed: ' + error, 'error');
      return false;
    }
    if (!code) return false;

    const codeVerifier = localStorage.getItem('spotify_code_verifier');
    if (!codeVerifier) {
      setStatus('error', 'Missing code verifier. Try logging in again.');
      return false;
    }

    setStatus('', 'Exchanging code for token…');
    showToast('Authenticating…', '');

    try {
      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code: code,
          redirect_uri: REDIRECT_URI,
          code_verifier: codeVerifier
        })
      });
      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_access_token', data.access_token);
        localStorage.setItem('spotify_refresh_token', data.refresh_token || '');
        localStorage.setItem('spotify_token_expires', Date.now() + (data.expires_in * 1000));
        window.history.replaceState({}, document.title, window.location.pathname);
        showToast('Connected!', 'success');
        return true;
      } else {
        setStatus('error', 'Token exchange failed: ' + (data.error_description || data.error));
        showToast('Token failed: ' + (data.error_description || data.error), 'error');
        return false;
      }
    } catch (e) {
      setStatus('error', 'Network error during token exchange.');
      showToast('Network error', 'error');
      return false;
    }
  }

  async function refreshAccessToken() {
    const refreshToken = localStorage.getItem('spotify_refresh_token');
    if (!refreshToken) return null;
    try {
      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'refresh_token',
          refresh_token: refreshToken
        })
      });
      const data = await response.json();
      if (data.access_token) {
        localStorage.setItem('spotify_access_token', data.access_token);
        localStorage.setItem('spotify_token_expires', Date.now() + (data.expires_in * 1000));
        if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
        return data.access_token;
      }
    } catch (e) { console.error('Refresh failed', e); }
    return null;
  }

  async function getValidToken() {
    const token = localStorage.getItem('spotify_access_token');
    const expiry = parseInt(localStorage.getItem('spotify_token_expires') || '0');
    if (token && Date.now() < expiry - 60000) return token;
    return await refreshAccessToken();
  }

  // ---------- PLAYER ----------
  window.onSpotifyWebPlaybackSDKReady = () => {
    if (window.Spotify && window.Spotify.Player) {
      tryInitPlayer();
    }
  };

  async function tryInitPlayer() {
    const token = await getValidToken();
    if (!token) {
      authRow.classList.remove('hidden');
      setStatus('', 'Click Connect to log in with Spotify Premium');
      startVisualizer();
      return;
    }

    authRow.classList.add('hidden');
    logoutLink.classList.remove('hidden');

    if (player) return; // already initialized

    player = new Spotify.Player({
      name: 'Spotify PFP Visualizer',
      getOAuthToken: async (cb) => {
        const t = await getValidToken();
        cb(t);
      },
      volume: parseInt(volumeSlider.value) / 100
    });

    player.addListener('ready', ({ device_id }) => {
      deviceId = device_id;
      playerReady = true;
      setStatus('ready', 'Ready! Open Spotify, choose "Spotify PFP Visualizer" as the device, and play a track.');
      showToast('Player ready! Select "Spotify PFP Visualizer" in Spotify.', 'success');
      enableControls(true);
      if (!animationFrame) startVisualizer();
    });

    player.addListener('not_ready', () => {
      setStatus('error', 'Device went offline. Reconnecting…');
      playerReady = false;
    });

    player.addListener('player_state_changed', (state) => {
      if (!state) return;
      isPlaying = !state.paused;
      progressMs = state.position;
      durationMs = state.duration;

      if (state.track_window && state.track_window.current_track) {
        const track = state.track_window.current_track;
        trackTitle.textContent = track.name;
        trackArtist.textContent = track.artists.map(a => a.name).join(', ');
        if (track.album && track.album.images && track.album.images.length > 0) {
          trackArt.src = track.album.images[track.album.images.length - 1].url;
        }
        trackCard.classList.remove('hidden');
      }

      if (isPlaying) {
        setStatus('playing', 'Now playing');
      } else {
        setStatus('ready', 'Paused');
      }

      updatePlayPauseButtons();
      updateTime();
    });

    player.addListener('initialization_error', ({ message }) => {
      setStatus('error', message);
      showToast('Init error: ' + message, 'error');
    });
    player.addListener('authentication_error', ({ message }) => {
      setStatus('error', message);
      showToast('Auth error: ' + message, 'error');
      if (message.toLowerCase().includes('premium') || message.toLowerCase().includes('scope')) {
        authRow.classList.remove('hidden');
      }
    });
    player.addListener('account_error', ({ message }) => {
      setStatus('error', 'Premium required');
      showToast('Spotify Premium required for streaming', 'error');
    });

    const success = await player.connect();
    if (!success) {
      setStatus('error', 'Failed to connect player. Click Connect to retry.');
      authRow.classList.remove('hidden');
    }
  }

  // ---------- CONTROLS ----------
  function enableControls(enabled) {
    playBtn.disabled = !enabled || isPlaying;
    pauseBtn.disabled = !enabled || !isPlaying;
    prevBtn.disabled = !enabled;
    nextBtn.disabled = !enabled;
  }

  function updatePlayPauseButtons() {
    playBtn.disabled = !playerReady || isPlaying;
    pauseBtn.disabled = !playerReady || !isPlaying;
  }

  playBtn.addEventListener('click', () => { if (player) player.resume(); });
  pauseBtn.addEventListener('click', () => { if (player) player.pause(); });
  prevBtn.addEventListener('click', () => { if (player) player.previousTrack(); });
  nextBtn.addEventListener('click', () => { if (player) player.nextTrack(); });

  volumeSlider.addEventListener('input', () => {
    if (player) player.setVolume(parseInt(volumeSlider.value) / 100);
  });

  logoutLink.addEventListener('click', () => {
    if (player) { try { player.disconnect(); } catch(e) {} }
    localStorage.removeItem('spotify_access_token');
    localStorage.removeItem('spotify_refresh_token');
    localStorage.removeItem('spotify_token_expires');
    localStorage.removeItem('spotify_code_verifier');
    location.reload();
  });

  // ---------- TIME ----------
  function updateTime() {
    const cur = Math.floor(progressMs / 1000);
    const dur = Math.floor(durationMs / 1000);
    timeDisplay.textContent = formatTime(cur) + ' / ' + formatTime(dur);
    if (durationMs > 0) {
      trackProgress.style.width = ((progressMs / durationMs) * 100) + '%';
    } else {
      trackProgress.style.width = '0%';
    }
  }
  function formatTime(s) {
    if (!isFinite(s) || s < 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  // Poll position every second while playing (SDK doesn't auto-update)
  setInterval(() => {
    if (player && isPlaying) {
      player.getCurrentState().then(state => {
        if (!state) return;
        progressMs = state.position;
        durationMs = state.duration;
        updateTime();
      });
    }
  }, 1000);

  // ---------- PFP ----------
  pfpInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file || !file.type.startsWith('image/')) {
      if (file) showToast('Please select an image', 'error');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      pfpImage.src = ev.target.result;
      pfpImage.style.display = 'block';
      pfpPlaceholder.style.display = 'none';
      showToast('PFP updated!', 'success');
    };
    reader.readAsDataURL(file);
  });

  // ---------- VISUALIZER ----------
  function startVisualizer() {
    if (animationFrame) return;
    function draw() {
      const dpr = window.devicePixelRatio || 1;
      const cssW = canvas.clientWidth;
      const cssH = canvas.clientHeight;
      if (canvas.width !== cssW * dpr) {
        canvas.width = cssW * dpr;
        canvas.height = cssH * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      ctx.clearRect(0, 0, cssW, cssH);

      const bg = ctx.createLinearGradient(0, 0, cssW * 0.8, cssH);
      bg.addColorStop(0, '#05060c');
      bg.addColorStop(0.8, '#0b0e1e');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, cssW, cssH);

      visualPhase += isPlaying ? 0.07 : 0.02;

      const barCount = 64;
      const barWidth = (cssW / barCount) * 0.6;
      const gap = (cssW / barCount) * 0.4;
      const baseY = cssH * 0.85;
      const maxBarHeight = cssH * 0.72;
      const progressFactor = durationMs > 0 ? (progressMs / durationMs) : 0;

      for (let i = 0; i < barCount; i++) {
        let value;
        if (isPlaying) {
          const w1 = Math.sin(i * 0.3 + visualPhase) * 0.5;
          const w2 = Math.sin(i * 0.7 + visualPhase * 1.7) * 0.3;
          const w3 = Math.sin(i * 1.1 + visualPhase * 2.3) * 0.2;
          value = Math.min(1, Math.max(0.1, Math.abs(w1 + w2 + w3) + 0.15 + progressFactor * 0.15));
        } else {
          value = 0.1 + Math.abs(Math.sin(i * 0.3 + visualPhase)) * 0.15;
        }

        const barHeight = value * maxBarHeight + 5;
        const x = i * (barWidth + gap) + gap * 0.5;
        const y = baseY - barHeight;
        const hue = 250 + (i / barCount) * 70 + (value * 30);
        const lightness = 55 + value * 30;

        ctx.fillStyle = `hsla(${hue},85%,${lightness}%,.85)`;
        ctx.shadowColor = `hsla(${hue},95%,65%,.9)`;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(x, y, barWidth, barHeight, 5);
        } else {
          ctx.rect(x, y, barWidth, barHeight);
        }
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';

      // Reflection
      ctx.globalAlpha = 0.15;
      for (let i = 0; i < barCount; i += 2) {
        let value;
        if (isPlaying) {
          const w1 = Math.sin(i * 0.3 + visualPhase) * 0.5;
          const w2 = Math.sin(i * 0.7 + visualPhase * 1.7) * 0.3;
          value = Math.min(1, Math.abs(w1 + w2) + 0.2);
        } else {
          value = 0.15;
        }
        const barHeight = value * maxBarHeight * 0.4 + 3;
        const x = i * (barWidth + gap) + gap * 0.5;
        ctx.fillStyle = `hsla(${250 + (i / barCount) * 70},85%,60%,.6)`;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, baseY + 3, barWidth, barHeight, 4);
        else ctx.rect(x, baseY + 3, barWidth, barHeight);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // Baseline
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(124,92,255,.35)';
      ctx.lineWidth = 2;
      ctx.moveTo(15, baseY + 2);
      ctx.lineTo(cssW - 15, baseY + 2);
      ctx.stroke();

      animationFrame = requestAnimationFrame(draw);
    }
    draw();
  }

  // ---------- BOOT ----------
  async function boot() {
    loginBtn.addEventListener('click', startAuthFlow);

    // Handle OAuth callback first
    const loggedIn = await handleAuthCallback();

    if (loggedIn) {
      // Wait for SDK to load, then init
      if (window.Spotify && window.Spotify.Player) {
        setTimeout(tryInitPlayer, 300);
      }
      // else onSpotifyWebPlaybackSDKReady will fire
    } else {
      // Existing session?
      const token = await getValidToken();
      if (token) {
        authRow.classList.add('hidden');
        setStatus('', 'Loading Spotify SDK…');
        if (window.Spotify && window.Spotify.Player) {
          setTimeout(tryInitPlayer, 300);
        }
      } else {
        authRow.classList.remove('hidden');
        setStatus('', 'Click Connect to log in with Spotify Premium');
        startVisualizer();
      }
    }

    // Always start visualizer animation
    if (!animationFrame) startVisualizer();
  }

  boot();

  // Safety: re-init player if SDK loads after boot
  const existingReady = window.onSpotifyWebPlaybackSDKReady;
  window.onSpotifyWebPlaybackSDKReady = () => {
    if (existingReady) existingReady();
    if (!player && localStorage.getItem('spotify_access_token')) {
      tryInitPlayer();
    }
  };

  window.addEventListener('beforeunload', () => {
    if (player) { try { player.disconnect(); } catch(e) {} }
  });
})();
</script>
</body>
</html>
